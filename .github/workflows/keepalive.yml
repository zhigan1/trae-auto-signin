name: 仓库保活

on:
  schedule:
    # 每周一 UTC 21:00 = 北京时间周二 05:00
    - cron: '0 21 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新保活时间戳
        run: |
          echo "最近保活时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || git commit -m "chore: 自动保活 $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git push || echo "无需推送"

      - name: 保活完成
        run: echo "✅ 仓库保活完成，防止 Actions 因 60 天无提交被禁用"
